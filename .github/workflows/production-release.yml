name: Calc Production Release

on:
  workflow_run:
    workflows: ["Deploy Calc to GitHub Pages"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: calc-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download deployed SHA handoff
        uses: actions/download-artifact@v4
        with:
          name: calc-certified-sha
          path: .release-source
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve exact deployed commit
        run: |
          set -euo pipefail
          CERTIFIED_SHA="$(tr -d '\r\n' < .release-source/certified-sha.txt)"
          test -n "$CERTIFIED_SHA"
          git fetch origin "$CERTIFIED_SHA"
          git checkout --detach "$CERTIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          echo "CERTIFIED_SHA=$CERTIFIED_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load release metadata
        run: |
          node <<'NODE'
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync("release.json","utf8"));
          if(!/^\d+\.\d+\.\d+$/.test(r.version)||r.tag!=="v"+r.version||r.status!=="production") process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV,"RELEASE_VERSION="+r.version+"\nRELEASE_TAG="+r.tag+"\n");
          NODE

      - name: Final production release gate
        run: node tests/production-release-gate.js

      - name: Verify live Pages deployment
        run: |
          set -euo pipefail
          LIVE_BASE="https://thiepn.github.io/calc"
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 3 "$LIVE_BASE/release.json" -o /tmp/calc-release.json
          node -e 'const r=require("/tmp/calc-release.json"); if(r.version!==process.env.RELEASE_VERSION||r.tag!==process.env.RELEASE_TAG||r.status!=="production") process.exit(1);'
          test "$(curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$LIVE_BASE/VERSION" | tr -d '\r\n')" = "$RELEASE_VERSION"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$LIVE_BASE/manifest.webmanifest" -o /tmp/calc-manifest.json
          node -e 'const r=require("/tmp/calc-manifest.json"); if(r.version!==process.env.RELEASE_VERSION) process.exit(1);'
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$LIVE_BASE/app.js" | grep -F "const APP_VERSION=\"$RELEASE_VERSION\";"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$LIVE_BASE/sw.js" | grep -F "const APP_VERSION=\"$RELEASE_VERSION\";"
          echo "Live deployment reports Calc $RELEASE_TAG."

      - name: Generate immutable release checksums
        run: node tests/generate-release-artifacts.js

      - name: Reject mismatched pre-existing release tag
        run: |
          set -euo pipefail
          if TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            test "$TAG_SHA" = "$CERTIFIED_SHA"
          fi

      - name: Create or verify production GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            test "$TAG_SHA" = "$CERTIFIED_SHA"
          else
            gh release create "$RELEASE_TAG" \
              --target "$CERTIFIED_SHA" \
              --title "Calc $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              "release-artifacts/calc-$RELEASE_TAG-checksums.txt" \
              "release-artifacts/calc-$RELEASE_TAG-manifest.json"
          fi

      - name: Verify released tag
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$CERTIFIED_SHA"
          gh release view "$RELEASE_TAG" --json tagName,name,isDraft,isPrerelease --jq '.tagName+" "+.name+" draft="+(.isDraft|tostring)+" prerelease="+(.isPrerelease|tostring)'
