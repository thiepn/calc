name: Calc CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: calc-ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject stale push candidate
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$CURRENT_MAIN" ]; then
            echo "Stale CI candidate $GITHUB_SHA; current main is $CURRENT_MAIN"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check math.js
          node --check algebra.js
          node --check calculus.js
          node --check cas.js
          node --check multivariable.js
          node --check ode.js
          node --check optimization.js
          node --check advanced-linear-algebra.js
          node --check numerical-mathematics.js
          node --check discrete-mathematics.js
          node --check calculus-worker.js
          node --check units.js
          node --check linear-algebra.js
          node --check statistics.js
          node --check statistics-worker.js
          node --check graph.js
          node --check graph-worker.js
          node --check tools.js
          node --check custom-tools.js
          node --check notebook.js
          node --check persistence.js
          node --check app.js
          node --check sw.js
          node --check tests/smoke.js
          node --check tests/core-kernel.js
          node --check tests/core-fuzz.js
          node --check tests/algebra.js
          node --check tests/calculus.js
          node --check tests/cas.js
          node --check tests/multivariable.js
          node --check tests/ode.js
          node --check tests/optimization.js
          node --check tests/advanced-linear-algebra.js
          node --check tests/numerical-mathematics.js
          node --check tests/discrete-mathematics.js
          node --check tests/university-workload.js
          node --check tests/university-workload.spec.js
          node --check tests/units.js
          node --check tests/linear-algebra.js
          node --check tests/statistics.js
          node --check tests/graph.js
          node --check tests/tools.js
          node --check tests/custom-tools.js
          node --check tests/notebook.js
          node --check tests/persistence.js
          node --check tests/persistence-integration.js
          node --check playwright.config.js
          node --check tests/release-gate.js
          node --check tests/production-release-gate.js
          node --check tests/generate-release-artifacts.js
          node --check tests/release-soak.spec.js
          node --check tests/bug-sweep.spec.js
      - name: Core smoke tests
        run: node tests/smoke.js
      - name: Core kernel certification
        run: node tests/core-kernel.js
      - name: Deterministic expression fuzzing
        run: node tests/core-fuzz.js
      - name: Symbolic algebra certification
        run: node tests/algebra.js
      - name: Calculus and numerical certification
        run: node tests/calculus.js
      - name: Advanced CAS U1 certification
        run: node tests/cas.js
      - name: Multivariable Calculus & Vector Analysis U2 certification
        run: node tests/multivariable.js
      - name: Differential Equations & Dynamical Systems U3 certification
        run: node tests/ode.js
      - name: Optimization & Mathematical Programming U4 certification
        run: node tests/optimization.js
      - name: Units quantities constants and engineering certification
        run: node tests/units.js
      - name: Linear Algebra V2 certification
        run: node tests/linear-algebra.js
      - name: Advanced Linear Algebra U5 certification
        run: node tests/advanced-linear-algebra.js
      - name: Numerical Mathematics U6 certification
        run: node tests/numerical-mathematics.js
      - name: Discrete Mathematics & Combinatorics U7 certification
        run: node tests/discrete-mathematics.js
      - name: Final university-workload U8 certification
        run: node tests/university-workload.js
      - name: Probability Statistics and Data V2 certification
        run: node tests/statistics.js
      - name: Graphing V2 certification
        run: node tests/graph.js
      - name: Specialized calculators V2 certification
        run: node tests/tools.js
      - name: Custom Formula Builder certification
        run: node tests/custom-tools.js
      - name: Worksheets and Notebooks V2 certification
        run: node tests/notebook.js
      - name: Persistence backup and sync certification
        run: node tests/persistence.js
      - name: Persistence browser integration certification
        run: node tests/persistence-integration.js
      - name: Release-candidate static gate
        run: node tests/release-gate.js
      - name: Production release gate
        run: node tests/production-release-gate.js
