name: Deploy Calc to GitHub Pages

on:
  workflow_run:
    workflows: ["Calc Release Soak"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Record exact certified SHA
        run: |
          mkdir -p "${RUNNER_TEMP}/calc-certified-sha"
          printf '%s\n' "${{ github.event.workflow_run.head_sha }}" > "${RUNNER_TEMP}/calc-certified-sha/certified-sha.txt"
      - name: Upload certified SHA handoff
        uses: actions/upload-artifact@v4
        with:
          name: calc-certified-sha
          path: ${{ runner.temp }}/calc-certified-sha/certified-sha.txt
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload certified static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
